name: Filme de Hoje
on:
  schedule:
    - cron: "0 12 * * *" # 12:00 UTC = 9h em Recife
  workflow_dispatch: # botão "Run workflow" pra testar
jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node postar-filme.js
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
