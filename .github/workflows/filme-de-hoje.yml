name: Filme de Hoje
on:
  schedule:
    - cron: "0 12 * * *" # 12:00 UTC = 9h em Recife
  workflow_dispatch: # botão "Run workflow" pra testar
permissions:
  contents: write # pra commitar o postados.json de volta
jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node postar-filme.js
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      - name: Salva o histórico
        run: |
          if [ -z "$(git status --porcelain postados.json)" ]; then
            echo "postados.json não mudou — nada a commitar."
            exit 0
          fi
          TITULO=$(node -p "JSON.parse(require('fs').readFileSync('postados.json','utf8')).at(-1).titulo")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add postados.json
          git commit -m "Histórico: $TITULO"
          # Alguém pode ter commitado enquanto o job rodava.
          git pull --rebase --autostash
          git push
